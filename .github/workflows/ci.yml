name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TEST_DATABASE_URL: postgresql://operaflow:ci_only_password@localhost:5432/operaflow_test
  DATABASE_URL: postgresql://operaflow:ci_only_password@localhost:5432/operaflow_test
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: operaflow
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: operaflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U operaflow" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit (production deps; high/critical must be fixed or explicitly accepted)
        run: node scripts/audit-check.mjs
      - run: npm run db:generate
      - run: npm run build -w @operaflow/shared && npm run build -w @operaflow/db
      - name: Playwright Chromium (test engine + E2E)
        run: npx playwright install --with-deps chromium
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + API integration tests (PostgreSQL, SMTP test server, real Chromium)
        run: npm test
      - name: Build
        run: npm run build -w @operaflow/api && npm run build -w @operaflow/web
      - name: Browser end-to-end tests
        run: npm run e2e
      - name: E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile --target runtime -t operaflow-api:ci .
      - run: docker build -f apps/web/Dockerfile -t operaflow-web:ci .
      - name: Compose config is valid
        run: |
          cp deploy/.env.docker.example deploy/.env.docker
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci/; s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=$(openssl rand -base64 32)|" deploy/.env.docker
          docker compose --env-file deploy/.env.docker config -q
