name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: operaflow
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: operaflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U operaflow" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://operaflow:ci_only_password@localhost:5432/operaflow_test
      DATABASE_URL: postgresql://operaflow:ci_only_password@localhost:5432/operaflow_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build -w @operaflow/shared && npm run build -w @operaflow/db
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (unit + API integration against PostgreSQL)
        run: npm test
      - name: Build
        run: npm run build -w @operaflow/api && npm run build -w @operaflow/web

  docker:
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile --target runtime -t operaflow-api:ci .
      - run: docker build -f apps/web/Dockerfile -t operaflow-web:ci .
