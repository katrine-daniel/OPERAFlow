<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPERAFlow</title>
<meta name="description" content="OPERAFlow interactive demo: bookings, reconciliation, supplier follow-ups, daily reports and booking-site tests — with sample data, running in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f5c6e'/%3E%3Ctext x='16' y='21' font-family='Segoe UI,Arial' font-size='13' font-weight='700' fill='white' text-anchor='middle'%3EOF%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="demo/app.css">
</head>
<body>
  <div class="demo-bar">
    <span><b>Interactive demo</b> · sample data · runs in your browser, nothing is sent anywhere</span>
    <button data-action="reset">Reset demo data</button>
    <a href="tour.html">Product tour</a>
    <a href="https://github.com/katrine-daniel/OPERAFlow">Source on GitHub</a>
  </div>
  <div class="layout">
    <aside class="side">
      <div class="brand"><i>OF</i><span>OPERA<b>Flow</b></span></div>
      <nav class="menu" id="menu" aria-label="Main"></nav>
    </aside>
    <div class="scrim" data-action="menu"></div>
    <div class="main">
      <header class="bar">
        <button class="burger" data-action="menu" aria-label="Open navigation">☰</button>
        <form id="search" role="search"><input type="search" name="q" placeholder="Search bookings by ref, guest or hotel…" aria-label="Search bookings"></form>
        <div class="role">
          <button class="burger" style="display:grid" data-action="theme" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
          <span class="who">Viewing as</span>
          <select id="role" aria-label="Switch role"></select>
          <span class="avatar" id="avatar"></span>
        </div>
      </header>
      <main class="content" id="content"></main>
    </div>
  </div>
  <script src="demo/data.js"></script>
  <script src="demo/app.js"></script>
</body>
</html>
